<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Form</title>
</head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/fontawesome.min.css"
    integrity="sha512-M5Kq4YVQrjg5c2wsZSn27Dkfm/2ALfxmun0vUE3mPiJyK53hQBHYCVAtvMYEC7ZXmYLg8DVG4tF8gD27WmDbsg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />



<body>
    <div class="container-fluid bg-info h-50">
        <div id="home" class="row justify-content-center">

            <div class="col-9 w-50 d-flex justify-content-center align-items-center min-vh-100 ">
                <input type="hidden" id="index">
                <div class="card m-5 p-5 border-dark w-100">
                    <div>
                        <h1 class="p-3 text-center">Enroll To The Exam</h1>
                    </div>
                    <form>
                        <div class="mb-3">
                            <label for="" class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" aria-describedby="emailHelp">

                        </div>
                        <div class="mb-3">
                            <label for="" class="form-label">Roll No</label>
                            <input type="number" class="form-control" id="rollno">
                        </div>


                    </form>
                    <button type="enroll" class="btn btn-primary w-50 d-block mx-auto"
                        onclick="Enroll()">Enroll</button>


                </div>


            </div>

        </div>
        <div class="row" id="result"> </div>
    </div>


    <script>
        var arr = [];
        var currentQ = 1;
        displaystart();
        function Enroll() {


            var name = document.getElementById("name").value;
            var rollno = document.getElementById("rollno").value;
            if (name == "" || rollno == "") {
                alert("Fill the all Details...");
            } else {
                alert("Successfull...");
                document.getElementById("home").style.display = 'none';
            }




            var obj = {
                "name": name,
                "rollno": rollno
            }
            arr.push(obj);

            // console.log(arr)
            displaystart();

            reset();






        }



        function reset() {
            document.getElementById("name").value = "";
            parseInt(document.getElementById("rollno").value = "");

        }

        function displaystart() {
            var html = "";

            for (var i = 0; i < arr.length; i++) {

                html += `
                <div class="row justify-content-center">
                     
                    <div class="col-9 w-50 d-flex justify-content-center align-items-center min-vh-100">
                     
                    <div class="card m-5 p-5 border-dark w-100">
                        <h2 class="text-center text-info"> <i class="fa-solid fa-circle-user" style="color: rgb(19, 20, 20);"></i>${arr[i].name}</h2>
                    <h1 class="p-3 text-center">Start Test</h1>
                    <button type="start"  id="startBtn" class="btn btn-primary w-50 m-3 d-block mx-auto" onclick="second('${arr[i].name}', '${arr[i].rollno}', ${i})">Start</button>
                    <strong class="text-center">Rules:</strong>
                    <ol class="list-group-numbered p-3">
                        <li class="list-group-item text-center">Each question is worth 5 marks and must be attempted one
                            at a time, in order.</li>
                        <li class="list-group-item text-center">Scoring more than 3 marks (4 or 5) on a question means
                            Pass; 3 or below means Fail.</li>
                        <li class="list-group-item text-center">Once answered, a question cannot be revisited or
                            changed.</li>

                    </ol>
                     


                </div>
                </div>
            </div>
                 
                 `;

            }



            document.getElementById("result").innerHTML = html;
        }




        function test1() {
            var html = "";

            for (var i = 0; i < arr.length; i++) {

                html += `
                
                <div class="row justify-content-center">
    <div class="col-9 w-50 d-flex justify-content-center align-items-center min-vh-100">
        <div class="card m-5 p-5 border-dark w-100">
            <h2 class="text-center text-info"> <i class="fa-solid fa-circle-user"
                    style="color: rgb(19, 20, 20);"></i>${arr[i].name}</h2>
            <div class="question1">
                <strong>Question 1:</strong>
                <h3>Which method is used to select an HTML element by its ID in JavaScript?</h3>
                 
                <label for="choices" class="p-3">Choose Correct Option:</label>
                <select id="choices1" name="choice" class="">
                    <option value="option1">document.querySelector()</option>
                    <option value="option2">document.getElementById()</option>
                    <option value="option3">document.getElementsByClass()</option>
                    <option value="option4">document.selectId()</option>
                </select>
                <div class="d-flex gap-3 m-3">

                    <button class="btn btn-primary w-50 d-block mx-auto" onclick="next()" id="q1"> Next <i
                            class="fa-solid fa-arrow-right" style="color: rgb(240, 247, 247);"></i> </button>
                </div>

            </div>
        </div>
    </div>
</div>
                 
                 `;

            }



            document.getElementById("result").innerHTML = html;
        }

        function next() {
            currentQ++;
            if (currentQ === 2) test2();
            else if (currentQ === 3) test3();
            else if (currentQ === 4) test4();
            else if (currentQ === 5) test5();
        }

        function previous() {
            currentQ--;
            if (currentQ === 1) test1();
            else if (currentQ === 2) test2();
            else if (currentQ === 3) test3();
            else if (currentQ === 4) test4();
        }
        function second() {
            currentQ = 1;
            totalMarks = 0;
            test1();
            if (currentQ === 2) {
                test2();

            } else if (currentQ === 3) {
                test3();
            } else if (currentQ === 4) {
                test4();
            } else if (currentQ === 5) test5();

        }


        function test2() {
            var html = "";

            for (var i = 0; i < arr.length; i++) {

                html += `
                
                <div class="row justify-content-center">
    <div class="col-9 w-50 d-flex justify-content-center align-items-center min-vh-100">
        <div class="card m-5 p-5 border-dark w-100">
            <h2 class="text-center text-info"> <i class="fa-solid fa-circle-user"
                    style="color: rgb(19, 20, 20);"></i>${arr[i].name}</h2>
            <div class="question2">
                <strong>Question 2:</strong>
                <h3>Which of the following correctly declares a variable that cannot be reassigned?</h3>
                 
                <label for="choices" class="p-3">Choose Correct Option:</label>
                <select id="choices2" name="choice" class="">
                    <option value="option1">var x = 10;</option>
                    <option value="option2">let x = 10;</option>
                    <option value="option3">const x = 10;</option>
                    <option value="option4">static x = 10;</option>
                </select>
                <div class="d-flex gap-3 m-3">

                    <button class="btn btn-primary w-50 d-block mx-auto" onclick="previous()"> <i
                            class="fa-solid fa-arrow-left" style="color: rgb(240, 247, 247);"></i> Previous</button>
                    <button class="btn btn-primary w-50 d-block mx-auto" onclick="next()"> Next <i
                            class="fa-solid fa-arrow-right" style="color: rgb(240, 247, 247);"></i> </button>
                </div>
            </div>
        </div>
    </div>
</div>
                 
                 `;

            }



            document.getElementById("result").innerHTML = html;
        }

        function test3() {
            var html = "";

            for (var i = 0; i < arr.length; i++) {

                html += `
                
                <div class="row justify-content-center">
    <div class="col-9 w-50 d-flex justify-content-center align-items-center min-vh-100">
        <div class="card m-5 p-5 border-dark w-100">
            <h2 class="text-center text-info"> <i class="fa-solid fa-circle-user"
                    style="color: rgb(19, 20, 20);"></i>${arr[i].name}</h2>
            <div class="question3">
                <strong>Question 3:</strong>
                <h3>What will typeof "Hello" return?</h3>
                 
                <label for="choices" class="p-3">Choose Correct Option:</label>
                <select id="choices3" name="choice" class="">
                    <option value="option1">string</option>
                    <option value="option2">object</option>
                    <option value="option3">text</option>
                    <option value="option4">undefined</option>
                </select>
                
                <div class="d-flex gap-3 m-3">

                    <button class="btn btn-primary w-50 d-block mx-auto" onclick="previous()"> <i
                            class="fa-solid fa-arrow-left" style="color: rgb(240, 247, 247);"></i> Previous</button>
                    <button class="btn btn-primary w-50 d-block mx-auto" onclick="next()"> Next <i
                            class="fa-solid fa-arrow-right" style="color: rgb(240, 247, 247);"></i> </button>
                </div>
            </div>
        </div>
    </div>
</div>
                 
                 `;

            }



            document.getElementById("result").innerHTML = html;
        }

        function test4() {
            var html = "";

            for (var i = 0; i < arr.length; i++) {

                html += `
                
               <div class="row justify-content-center">
    <div class="col-9 w-50 d-flex justify-content-center align-items-center min-vh-100">
        <div class="card m-5 p-5 border-dark w-100">
            <h2 class="text-center text-info"> <i class="fa-solid fa-circle-user"
                    style="color: rgb(19, 20, 20);"></i>${arr[i].name}</h2>
            <div class="question4">
                <strong>Question 4:</strong>
                <h3>Which CSS property change hides an HTML element completely (removes it from layout)?</h3>

                <label for="choices" class="p-3">Choose Correct Option:</label>
                <select id="choices4" name="choice" class="">
                    <option value="option1">visibility: hidden;</option>
                    <option value="option2">opacity: 0;</option>
                    <option value="option3">display: none;</option>
                    <option value="option4">hidden: true;</option>
                </select>
                <div class="d-flex gap-3 m-3">

                    <button class="btn btn-primary w-50 d-block mx-auto" onclick="previous()"> <i
                            class="fa-solid fa-arrow-left" style="color: rgb(240, 247, 247);"></i> Previous</button>
                    <button class="btn btn-primary w-50 d-block mx-auto" onclick="next()"> Next <i
                            class="fa-solid fa-arrow-right" style="color: rgb(240, 247, 247);"></i> </button>
                </div>

            </div>
        </div>
    </div>
</div>
                 
                 `;

            }



            document.getElementById("result").innerHTML = html;
        }

        function test5() {
            var html = "";

            for (var i = 0; i < arr.length; i++) {

                html += `
                
                <div id="q5" class="row justify-content-center">
    <div class="col-9 w-50 d-flex justify-content-center align-items-center min-vh-100">
        <div class="card m-5 p-5 border-dark w-100">
            <h2 class="text-center text-info"> <i class="fa-solid fa-circle-user"
                    style="color: rgb(19, 20, 20);"></i>${arr[i].name}</h2>
            <div class="question5">
                <strong>Question 5:</strong>
                <h3>Which of these is used to add a click event to a button in JavaScript?</h3>
                 
                <label for="choices" class="p-3">Choose Correct Option:</label>
                <select id="choices5" name="choice" class="">
                    <option value="option1"> button.onClick()</option>
                    <option value="option2">button.addEventListener("click", function)</option>
                    <option value="option3">button.click = function</option>
                    <option value="option4">button.event("click")</option>
                </select>
                <button class="btn btn-primary w-50 d-block mx-auto m-3" onclick="previous()"> <i
                            class="fa-solid fa-arrow-left" style="color: rgb(240, 247, 247);"></i> Previous</button>
                <button type="submit" class="btn btn-primary w-50 d-block mx-auto m-3" onclick="submit()">Submit</button>
            </div>
        </div>
    </div>
</div>
                 
                 `;

            }



            document.getElementById("result").innerHTML = html;
        }

        function displayend() {

            var html = "";

            for (var i = 0; i < arr.length; i++) {

                var status = totalMarks > 3 ? "Pass" : "Fail";

                html += `
        <div id="last" class="row justify-content-center">
        <div class="col-9 w-50 d-flex justify-content-center align-items-center min-vh-100">
        <div class="card m-5 p-5 border-dark w-100">
        <h2 class="text-center text-info"> <i class="fa-solid fa-circle-user" style="color: rgb(19, 20, 20);"></i>${arr[i].name}</h2>
            <div class="card m-3 p-3 border-0 text-center">
                <h1 class="p-3 text-center">Congratulations <i class="fa-solid fa-hands-clapping" style="color: rgb(19, 20, 20);"></i></h1>
                <h3 class="text-center">Total Marks: ${totalMarks} / 5</h3>
                <p class="text-center">Result: ${status}</p>
                <h2 class="p-3 text-center">Thank You</h2>
            </div>
        </div>
        </div>
        </div>
        

    
                 
                 `;

            }



            document.getElementById("result").innerHTML = html;
        }

        function submit() {
            checkAnswer(5);
            displayend();
        }



        var totalMarks = 0;

        var correctAnswers = {
            1: "option2",    // getElementById()
            2: "option3",   // const x = 10;
            3: "option1",   // string
            4: "option3",   // display: none;
            5: "option2"    // addEventListener
        };

        function checkAnswer(QNum) {
            var selected = document.getElementById("choices" + QNum).value;
            if (selected === correctAnswers[QNum]) {
                totalMarks += 5;
            }
        }








    </script>

</body>

</html>
