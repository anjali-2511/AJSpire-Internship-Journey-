<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var num = prompt("Enter  a number: ");
        if(num % 5 == 0 && num % 11 == 0){
            document.write("Divisible by both 5 and 11");
        }
        else{
            document.write("Not Divisible by both 5 and 11");
        }
    </script>
</body>
</html>
