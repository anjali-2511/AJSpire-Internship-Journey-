<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Years = TotalDays / 365 -->
     <!-- RemainingDays = TotalDays % 365)-->
     <!-- Weeks = RemainingDays / 7  -->
    <!-- Days = RemainingDays %7-->

    <div class="container mt-5">
        <div class="card p-4 shadow-sm">
            <h4 class="mb-4">Converts Total Days  into Years, Weeks, and Days </h4> 
            <form action="" id="daysForm" onsubmit="return false;">
                <div class="mb-3">
                    <label for="totalDays" class="form-label">Enter Total Days: </label>
                    <input type="number" id="totalDays" class="form-control" placeholder="Enter Total Days">
                </div>
                
                <button type="submit" class="btn btn-primary w-100" id="calcBtn">
                    Calculate
                </button>
                
            </form>
        </div>
        <div class="card p-4 shadow-sm mt-3">   
            <h4 class="mb-4">Result</h4>
            <div class="mb-3">
                <label for="years" class="form-label">Years: </label>
                <input type="text" id="years" class="form-control" readonly>
            </div>
            <div class="mb-3">
                <label for="weeks" class="form-label">Weeks: </label>
                <input type="text" id="weeks" class="form-control" readonly>
            </div>
            <div class="mb-3">
                <label for="days" class="form-label">Days: </label>
                <input type="text" id="days" class="form-control" readonly>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("calcBtn").addEventListener("click", function() {
            var totalDays = parseInt(document.getElementById("totalDays").value) || 0;

            var years = Math.floor(totalDays / 365);
            var remainingDays = totalDays % 365;
            var weeks = Math.floor(remainingDays / 7);
            var days = remainingDays % 7;

            document.getElementById("years").value = years;
            document.getElementById("weeks").value = weeks;
            document.getElementById("days").value = days;
        });
    </script>


</body>
</html>
