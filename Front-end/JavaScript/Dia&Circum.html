<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    
</head>
<body class="bg-light">
  <div class="container mt-5">
    <div class="card p-4 shadow-sm">
      <h4 class="mb-4">Circle Calculator</h4>

      <div class="mb-3">
        <label for="radius" class="form-label">Enter Radius of Circle:</label>
        <input type="number" id="radius" class="form-control" placeholder="Enter Radius">
      </div>

      <button onclick="calculate()" class="btn btn-primary mb-3">Calculate</button>

      <div class="mb-3">
        <label for="diameter" class="form-label">Diameter of Circle:</label>
        <input type="text" id="diameter" class="form-control" readonly>
      </div>

      <div class="mb-3">
        <label for="circumference" class="form-label">Circumference of Circle:</label>
        <input type="text" id="circumference" class="form-control" readonly>
      </div>
    </div>
  </div>

  <script>
    function calculate() {
      var radius = parseFloat(document.getElementById("radius").value) || 0;
      var diameter = 2 * radius;
      var circumference = 2 * Math.PI * radius;

      document.getElementById("diameter").value = diameter.toFixed(2);
      document.getElementById("circumference").value = circumference.toFixed(2);
    }
  </script>
</body>
</html>
