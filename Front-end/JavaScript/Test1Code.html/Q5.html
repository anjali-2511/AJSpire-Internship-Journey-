<head>
    <meta charset="UTF-8">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

        integrity="sha512-M5Kq4YVQrjg5c2wsZSn27Dkfm/2ALfxmun0vUE3mPiJyK53hQBHYCVAtvMYEC7ZXmYLg8DVG4tF8gD27WmDbsg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"

        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div>
        <div> <input type="hidden" id="index">

            Name: <input type="text" id="name">
            Branch: <input type="text" id="branch">
            Last Year Grade: <input type="text" id="grade">

            <button id="submit" onkeyup="crud()">Sumbit</button>
        </div>
        <div class="btn btn-primary mx-5" id="updateBtn" style="display: none;" onclick="updateForm()">
            Update</div>

        <div class="row" id="result"> </div>
    </div>

    <script>
        var arr = [];
        displayInfo();
        function crud() {

            var name = document.getElementById("name").value;
            var branch = document.getElementById("branch").value;
            var grade = parseInt(document.getElementById("grade").value);



            var obj = {
                "name": name,
                "branch": branch,
                "grade": grade
            }
            arr.push(obj);
            displayInfo();



            reset()



        }
        function reset() {
            document.getElementById("name").value = "";
            document.getElementById("branch").value = "";
            parseInt.document.getElementById("grade").value = "";

        }

        function displayInfo() {
            var html = "";
            for (var i = 0; i < arr.length; i++) {
                html += `
                    <div>
                        <div> 
                        <input type="text" id="name">${arr[i].name}
    <input type="text" id="branch">${arr[i].branch}
    <input type="text" id="grade">${arr[i].grade}
    </div>

    <div>
                                
                                <button onclick='editForm("${arr[i].name}",${arr[i].branch},${arr[i].grade}, ${i})'  class="  btn btn-primary m-3 p-2 w-50 ">Edit</button>

                                <button onclick='deleteData(${i})'  class="btn btn-primary m-3 p-2 w-40 ">Delete</button>

                                 </div>

    </div>

 

                 

 
                
                 
                 `;

            }



            document.getElementById("result").innerHTML = html;

        }

        function editForm(name, branch, grade) {
            document.getElementById("name").value = name;
            document.getElementById("branch").value = branch;
            document.getElementById("grade").value = grade;
            document.getElementById("submitBtn").style.display = 'none';
            document.getElementById("updateBtn").style.display = 'block';

        }
        function updateForm() {
            var name = document.getElementById("name").value;
            var branch = parseInt(document.getElementById("branch").value);
            var grade = parseInt(document.getElementById("grade").value);
            var obj = {
                "name": name,
                "branch": branch,
                "grade": grade
            };
            arr[index] = obj;
            reset();
            displayInfo();
            document.getElementById("submitBtn").style.display = 'block';
            document.getElementById("updateBtn").style.display = 'none';
        }
        function deleteData(index) {
            if (confirm("Are you sure?")) {
                var tempArr = arr.filter((data, i) => index != i);
                arr = tempArr;
                alert("Data Deleted!");
                displayInfo();
            }
        }




    </script>

</body>

</html>
