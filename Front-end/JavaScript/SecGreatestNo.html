<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <script>
        function findSecondGreatest() {
            var a = parseInt(document.getElementById("num1").value);
            var b = parseInt(document.getElementById("num2").value);
            var c = parseInt(document.getElementById("num3").value);

            if (a > b && a > c) {
                if (b > c) {
                    document.getElementById("result").value = "The second greatest number is: " + b;
                } else {
                    document.getElementById("result").value = "The second greatest number is: " + c;
                }
            } else if (b > a && b > c) {
                if (a > c) {
                    document.getElementById("result").value = "The second greatest number is: " + a;
                } else {
                    document.getElementById("result").value = "The second greatest number is: " + c;
                }
            } else if (c > a && c > b) {
                if (a > b) {
                    document.getElementById("result").value = "The second greatest number is: " + a;
                } else {
                    document.getElementById("result").value = "The second greatest number is: " + b;
                }
            } else {
                document.getElementById("result").value = "There is no single second greatest number.";
                
            }
        }
    </script>
    <div class="container mt-5">
        <div class="card p-4 shadow-sm">
            <h4 class="mb-4">Find the Second Greatest Number</h4>
            <div class="mb-3">  
                <label for="num1" class="form-label">Enter first number:</label>
                <input type="number" id="num1" class="form-control" placeholder="Enter first number">   
            </div>
            <div class="mb-3">
                <label for="num2" class="form-label">Enter second number:</label>
                <input type="number" id="num2" class="form-control" placeholder="Enter second number"> 
            </div>
            <div class="mb-3">
                <label for="num3" class="form-label">Enter third number:</label>   
                <input type="number" id="num3" class="form-control" placeholder="Enter third number">
            </div>
            <button type="button" class="btn btn-primary w-100" onclick="findSecondGreatest()">
                Find Second Greatest Number
            </button>
            <div class="mt-3">
                <label for="result" class="form-label">Result:</label>
                 <input type="text" id="result" class="form-control" readonly>
             </div>
        </div>
</body>
</html>
