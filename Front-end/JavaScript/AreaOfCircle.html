<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area of Circle Calculator</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-5">

                <div class="card shadow-lg p-4">

                    <h2 class="text-center text-primary mb-4">
                        Area of Circle 
                    </h2>

                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            Enter Value of π (Pi)
                        </label>
                        <input type="number"  class="form-control" id="pi" placeholder="3.14">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            Enter Radius of Circle
                        </label>
                        <input type="number" class="form-control" id="radius" placeholder="Enter Radius">
                    </div>

                    <div class="d-grid mb-3">
                        <button class="btn btn-primary" onclick="circle()">
                            Calculate Area
                        </button>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            Area of Circle
                        </label>
                        <input type="text" class="form-control" id="Ans" readonly>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>
        function circle() {

            var radius = parseFloat(document.getElementById("radius").value) || 0;
            var pi = parseFloat(document.getElementById("pi").value) || 3.14;

            var area = pi * radius * radius;

            document.getElementById("Ans").value = area.toFixed(2);

        }
    </script>

</body>

</html>
