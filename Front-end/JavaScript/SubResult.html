<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card shadow p-4">

                    <h2 class="text-center text-primary mb-4">
                        Student Result Checker
                    </h2>

                    <div class="mb-3">
                        <label class="form-label">Marks of English</label>
                        <input type="number" class="form-control" id="eng">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Marks of Math</label>
                        <input type="number" class="form-control" id="math">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Marks of Biology</label>
                        <input type="number" class="form-control" id="bio">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Marks of Physics</label>
                        <input type="number" class="form-control" id="phy">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Marks of Chemistry</label>
                        <input type="number" class="form-control" id="chem">
                    </div>


                    <div class="mb-3">
                        <label class="form-label">Total Marks</label>
                        <input type="text" class="form-control" id="total" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Percentage (%)</label>
                        <input type="text" class="form-control" id="percent" readonly>
                    </div>


                    <div class= "">
                        <label class="form-label">Grade</label>
                        <input type="text" class="form-control" id="grade" readonly>
                    </div>

                    <div class="d-grid mb-3">
                        <button class="btn btn-primary" onclick="result()">
                            Submit
                        </button>
                    </div>


                </div>

            </div>

        </div>

    </div>

    <script>
        function result() {

            var eng = parseInt(document.getElementById("eng").value) || 0;
            var math = parseInt(document.getElementById("math").value) || 0;
            var bio = parseInt(document.getElementById("bio").value) || 0;
            var phy = parseInt(document.getElementById("phy").value) || 0;
            var chem = parseInt(document.getElementById("chem").value) || 0;

            var total = eng + math + bio + phy + chem;
            var percentage = (total / 500) * 100;

            document.getElementById("total").value = total;
            document.getElementById("percent").value = percentage.toFixed(2) + "%";

            if (percentage > 90) {
                document.getElementById("grade").value = "A";
            } else if (percentage > 80 && percentage <= 90) {
                document.getElementById("grade").value = "B";
            } else if (percentage > 70 && percentage <= 80) {
                document.getElementById("grade").value = "C";
            } else if (percentage > 60 && percentage <= 70) {
                document.getElementById("grade").value = "D";
            } else if (percentage > 35 && percentage <= 60 ) {
                document.getElementById("grade").value = "Pass";
            } else {
                document.getElementById("grade").value = "Fail";
            } 
        }
    </script>

</body>

</html>
