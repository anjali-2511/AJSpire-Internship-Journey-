<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area of Rectangle Calculator</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-5">

                <div class="card shadow-lg p-4">

                    <h2 class="text-center text-primary mb-4">
                        Area of Rectangle 
                    </h2>

                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            Enter Length
                        </label>
                        <input type="number" class="form-control" id="length" placeholder="Enter Length">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            Enter Width
                        </label>
                        <input type="number" class="form-control" id="width" placeholder="Enter Width">
                    </div>

                    <div class="d-grid mb-3">
                        <button class="btn btn-primary" onclick="rectangle()">
                            Calculate Area
                        </button>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            Area of Rectangle
                        </label>
                        <input type="text" class="form-control" id="Ans" readonly>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>
        function rectangle() {

            var length = parseFloat(document.getElementById("length").value) || 0;
            var width = parseFloat(document.getElementById("width").value) || 0;

            var area = length * width;

            document.getElementById("Ans").value = area.toFixed(2);

        }
    </script>

</body>

</html>
