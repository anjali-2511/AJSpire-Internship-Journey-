<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <div class="container mt-5">
    <div class="card p-4 shadow-sm">
      <h4 class="mb-4">Triangle Angle Calculator</h4>

      <div class="mb-3">
        <label for="angle1" class="form-label">Enter 1st Angle:</label>
        <input type="number" id="angle1" class="form-control" placeholder="Enter 1st Angle">
      </div>

      <div class="mb-3">
        <label for="angle2" class="form-label">Enter 2nd Angle:</label>
        <input type="number" id="angle2" class="form-control" placeholder="Enter 2nd Angle">
      </div>

      <button onclick="check()" class="btn btn-primary mb-3">Check</button>

      <div class="mb-3">
        <label for="angle3" class="form-label">Value of Angle 3:</label>
        <input type="text" id="angle3" class="form-control" readonly>
      </div>
    </div>
  </div>

  
  <script>
    function check() {
      var angle1 = parseFloat(document.getElementById("angle1").value) || 0;
      var angle2 = parseFloat(document.getElementById("angle2").value) || 0;
      var angle3 = 180 - (angle1 + angle2);

      document.getElementById("angle3").value = angle3.toFixed(2);
    }
  </script>
</body>

</html>
